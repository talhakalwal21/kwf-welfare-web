name: Deploy KWF PC Website (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KWF_PC_Pages_Website.zip'
      - 'website-enhancements.js'
      - 'website-enhancements.css'
      - 'pakpdf/**'
      - '.github/workflows/deploy-kwf-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
      - name: Unpack website and configure publishable Supabase details
        env:
          KWF_SUPABASE_URL: ${{ vars.KWF_SUPABASE_URL }}
          KWF_SUPABASE_PUBLIC_KEY: ${{ vars.KWF_SUPABASE_PUBLIC_KEY }}
        run: |
          mkdir -p _site
          unzip -q KWF_PC_Pages_Website.zip -d _site
          test -f _site/index.html
          mkdir -p _site/pakpdf
          cp pakpdf/index.html _site/pakpdf/index.html
          cat website-enhancements.js >> _site/app.js
          cat website-enhancements.css >> _site/style.css
          node --check _site/app.js
          python3 - <<'PY'
          import json, os, pathlib
          data = {
            'supabaseUrl': os.environ.get('KWF_SUPABASE_URL','').strip(),
            'supabasePublishableKey': os.environ.get('KWF_SUPABASE_PUBLIC_KEY','').strip(),
            'foundationName': 'Kalwal Welfare Foundation',
          }
          pathlib.Path('_site/config.js').write_text(
            'window.KWF_CONFIG = Object.freeze(' + json.dumps(data) + ');\n',
            encoding='utf-8'
          )
          print('Web site contents ready. Supabase configured:', bool(data['supabaseUrl'] and data['supabasePublishableKey']))
          PY
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
